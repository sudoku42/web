<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview sudoku42 for iPhone &amp; iPad</title>
  <meta name="description" content="Preview sudoku42 for iPhone and iPad: shared daily puzzles, touch-first input, and results.">
  <link rel="canonical" href="https://sudoku42.com/iOS/preview.html">
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="style.css?v=4">
  <script src="../translate.js?v=22" defer></script>
  <script src="app.js?v=6" defer></script>
</head>
<body data-share-page="preview">
  <div class="page">
    <header><a href="/" class="brand"><img src="../icon.png" width="24" height="24" alt="">sudoku42</a></header>
    <main>
      <h1 data-i18n="previewHeading">One daily Sudoku. Everyone plays it. Coming soon!</h1>
      <section class="app-preview" aria-labelledby="preview-title">
        <h2 id="preview-title" data-i18n="previewSubheading">Compare your time worldwide.</h2>
        <p data-i18n="previewIntro">Play today’s shared Sudoku, then see how your time compares with players around the world.</p>
        <div class="preview-gallery" aria-label="sudoku42 app previews" data-i18n-attr="aria-label:gallery">
          <figure class="preview-card">
            <img src="img/1.png" width="2160" height="3840" alt="sudoku42 home screen showing a new daily challenge" fetchpriority="high">
            <figcaption data-i18n="captionOne">Today’s puzzle, shared worldwide.</figcaption>
          </figure>
          <figure class="preview-card">
            <img src="img/2.png" width="2160" height="3840" alt="A sudoku board with sudoku42’s circular number wheel open" loading="lazy">
            <figcaption data-i18n="captionTwo">Every move counts toward your time.</figcaption>
          </figure>
          <figure class="preview-card">
            <img src="img/3.png" width="2160" height="3840" alt="Daily results with playtime distribution and share button" loading="lazy">
            <figcaption data-i18n="captionThree">See how your time compares.</figcaption>
          </figure>
        </div>
      </section>
      <div class="below-signup-actions">
        <section class="share-compact" aria-label="Share this preview" data-i18n-attr="aria-label:sharePreviewAria">
          <button class="secondary share-button" type="button" data-i18n="sharePreview">Share this preview</button>
          <div class="share-fallback" hidden>
            <label data-i18n="shareLink">Link to share</label>
            <input class="share-url" type="url" readonly>
            <button class="secondary copy-button" type="button" data-i18n="copy">Copy link</button>
          </div>
          <p class="status share-status" role="status" aria-live="polite"></p>
        </section>
        <a class="preview-link preview-link-inline" href="index.html"><span data-i18n="returnWaitlistSmall">Waitlist 📃</span> <span aria-hidden="true">→</span></a>
      </div>
    </main>
    <footer><a href="/privacy/" data-i18n="privacy">Privacy</a><a href="mailto:manuel@sudoku42.com" data-i18n="contact">Contact Manuel</a><a href="https://play.google.com/store/apps/details?id=com.mriezebosch.sudoku" data-i18n="android">Android app</a></footer>
  </div>
</body>
</html>
